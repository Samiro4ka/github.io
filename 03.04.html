<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>METANIT.COM</title>
</head>
<body>
    <button id="openButton">Открыть окно</button>
    
    <script>
        let metanitWindow = null;
        
        function openWindow() {
            if (!metanitWindow || metanitWindow.closed) {
                metanitWindow = window.open("https://www.google.ru/", "_blank", "width=600,height=400,left=500,top=200");
                
                setTimeout(() => {
                    if (metanitWindow && !metanitWindow.closed) {
                        metanitWindow.close();
                    }
                }, 5000); 
            }
        }

        document.getElementById('openButton').addEventListener('click', openWindow);
    </script>
</body>
</html>
